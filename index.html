<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration Flow CRM V5 - Cloud Synchronisé</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style> 
        .hidden { display: none; }
        [dir="rtl"] .text-left { text-align: right; }
        [dir="rtl"] .text-right { text-align: left; }
        .sync-loader { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen" id="main-body" dir="ltr">

    <div id="cloud-loading-screen" class="fixed inset-0 bg-slate-900 text-white flex flex-col items-center justify-center z-[100]">
        <div class="text-4xl mb-4 sync-loader">🔄</div>
        <h2 class="text-lg font-bold tracking-wider uppercase mb-1">Immigration Flow Cloud</h2>
        <p class="text-xs text-slate-400 animate-pulse">Connexion à la base de données Google Sheets en cours...</p>
    </div>

    <div id="login-page" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-600 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="text-4xl mb-2">✈️</div>
            <h1 class="text-2xl font-bold text-blue-600 mb-1">IMMIGRATION FLOW</h1>
            <p class="text-gray-400 text-xs mb-6 font-semibold uppercase tracking-wider data-lang" data-fr="Système CRM V5 Évolué" data-ar="نظام إدارة علاقات العملاء المطور V5"></p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Identifiant (Email)" data-ar="البريد الإلكتروني"></label>
                    <input id="username" type="text" placeholder="siryounes66@gmail.com" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Mot de passe" data-ar="كلمة المرور"></label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold mt-6 hover:bg-blue-700 shadow-md hover:shadow-lg transition data-lang" data-fr="Se connecter" data-ar="تسجيل الدخول"></button>
            <p onclick="openForgotPasswordModal()" class="text-xs text-blue-500 font-semibold mt-4 cursor-pointer hover:underline data-lang" data-fr="Mot de passe oublié ?" data-ar="نسيت كلمة المرور؟"></p>
        </div>
    </div>

    <div id="forgot-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm mx-4">
            <h3 class="text-lg font-bold text-gray-800 mb-2 data-lang" data-fr="Récupération de compte" data-ar="استعادة الحساب"></h3>
            <p class="text-xs text-gray-500 mb-4 data-lang" data-fr="Veuillez saisir votre email pour répondre à votre question de sécurité." data-ar="الرجاء إدخال البريد الإلكتروني للإجابة على سؤال الأمان."></p>
            
            <div class="space-y-3">
                <input id="forgot-email" type="text" placeholder="Votre email" class="w-full p-2 border rounded-xl text-sm">
                <button onclick="verifyForgotEmail()" class="w-full bg-gray-800 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Vérifier l'identifiant" data-ar="التحقق من الهوية"></button>
                
                <div id="forgot-question-zone" class="hidden border-t pt-3 mt-3 space-y-2">
                    <p id="forgot-question-text" class="text-xs font-bold text-blue-600 italic"></p>
                    <input id="forgot-answer" type="text" placeholder="Votre réponse" class="w-full p-2 border rounded-xl text-sm">
                    <button onclick="submitSecretAnswer()" class="w-full bg-blue-600 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Valider la réponse" data-ar="تأكيد الإجابة"></button>
                </div>
            </div>
            <button onclick="document.getElementById('forgot-modal').classList.add('hidden')" class="w-full bg-gray-200 text-gray-700 mt-4 p-2 rounded-xl text-xs font-bold data-lang" data-fr="Fermer" data-ar="إغلاق"></button>
        </div>
    </div>

    <div id="app-page" class="hidden">
        <nav class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-1.5 rounded-lg text-lg">✈️</div>
                <div class="flex flex-col">
                    <span class="font-black tracking-wider text-sm md:text-base">IMMIGRATION FLOW</span>
                    <div class="flex items-center space-x-2 mt-0.5">
                        <span id="user-badge" class="text-[10px] bg-blue-900/50 text-blue-200 px-1.5 py-0.5 rounded font-mono font-bold w-max"></span>
                        <span id="sync-indicator" class="text-[9px] bg-green-900 text-green-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest">☁️ Synced</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1 rounded-xl text-xs font-bold transition">🌐 FR / عربي</button>
                <div class="flex bg-blue-800/40 p-1 rounded-xl space-x-1">
                    <button onclick="switchTab('dashboard')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Dashboard" data-ar="لوحة التحكم"></button>
                    <button onclick="switchTab('clients')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Clients" data-ar="الزبناء"></button>
                    <button id="nav-team" onclick="switchTab('team')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition hidden data-lang" data-fr="Équipe & Admin" data-ar="الفريق والتحكم"></button>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition shadow data-lang" data-fr="Déconnexion" data-ar="تسجيل الخروج"></button>
            </div>
        </nav>

        <div id="announcement-bar" class="bg-amber-50 border-l-4 border-amber-500 p-4 m-6 rounded-xl shadow-sm hidden">
            <div class="flex items-center space-x-2">
                <span class="text-base">📢</span>
                <span class="text-amber-800 font-bold text-xs uppercase tracking-wider data-lang" data-fr="Avis important :" data-ar="تنبيه هام :"></span>
                <span id="announcement-text" class="text-sm text-amber-900 font-semibold italic"></span>
            </div>
        </div>

        <div class="p-6 max-w-7xl mx-auto">
            
            <div id="tab-dashboard" class="tab-content">
                <h2 class="text-xl font-bold mb-6 text-gray-800 data-lang" data-fr="Tableau de bord opérationnel" data-ar="لوحة القيادة التشغيلية"></h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Chiffre d'Affaires Encaissé" data-ar="إجمالي الأرباح المحصلة"></p>
                            <p id="stat-ca" class="text-2xl font-black text-gray-800 mt-1">0 DH</p>
                        </div>
                        <div class="text-3xl bg-green-50 p-3 rounded-xl text-green-600">💰</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Acompte (50%)" data-ar="ملفات قيد المعالجة (50%)"></p>
                            <p id="stat-pending" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-amber-50 p-3 rounded-xl text-amber-600">⏳</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Finalisés (100%)" data-ar="الملفات المكتملة (100%)"></p>
                            <p id="stat-closed" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-blue-50 p-3 rounded-xl text-blue-600">✅</div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                    <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center space-x-2">
                        <span>📊</span>
                        <span class="data-lang" data-fr="Statistiques des Transactions et Revenus" data-ar="إحصائيات المعاملات والإيرادات"></span>
                    </h3>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider data-lang" data-fr="Répartition et Estimation Budgétaire" data-ar="توزيع وتقدير الميزانية"></h4>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-green-600 data-lang" data-fr="Revenus Encaissés (Actuels)" data-ar="الإيرادات المحصلة (الحالية)"></span>
                                    <span id="bar-label-encaissed" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-encaissed" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-amber-600 data-lang" data-fr="Reste à Recouvrer (Attente 50%)" data-ar="المتبقي للتحصيل (في الانتظار 50%)"></span>
                                    <span id="bar-label-remaining" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-remaining" class="bg-amber-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-gray-100">
                                <div class="flex justify-between text-xs font-bold mb-1">
                                    <span class="text-blue-700 data-lang" data-fr="Objectif & Volume d'Affaires Total" data-ar="الهدف وإجمالي حجم الأعمال"></span>
                                    <span id="bar-label-total" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-total" class="bg-blue-600 h-full transition-all duration-500" style="width: 100%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Panier Moyen Client" data-ar="متوسط سلة العميل"></p>
                                <p id="stat-avg-basket" class="text-lg font-black text-blue-600 mt-1 font-mono">0 DH</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Transactions Sans Avance" data-ar="معاملات بدون تسبيق"></p>
                                <p id="stat-unpaid-count" class="text-lg font-black text-red-500 mt-1">0</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Taux de Conversion (Soldé)" data-ar="معدل التحويل الكامل"></p>
                                <p id="stat-conversion-rate" class="text-lg font-black text-green-600 mt-1 font-mono">0%</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Volume de Dossiers Total" data-ar="إجمالي حجم الملفات"></p>
                                <p id="stat-total-clients" class="text-lg font-black text-gray-700 mt-1">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-clients" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 data-lang" data-fr="Gestion des Clients" data-ar="إدارة الزبناء"></h2>
                    <button onclick="openClientModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow transition data-lang" data-fr="+ Ajouter un Client" data-ar="+ إضافة زبon"></button>
                </div>
                
                <div class="bg-white rounded-2xl shadow overflow-x-auto border border-gray-100">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                                <th class="p-4 data-lang" data-fr="Date Ajout" data-ar="تاريخ الإضافة"></th>
                                <th class="p-4 data-lang" data-fr="Nom" data-ar="الاسم"></th>
                                <th class="p-4 data-lang" data-fr="Métier & Pays" data-ar="المهنة والبلد"></th>
                                <th class="p-4 data-lang" data-fr="Téléphone" data-ar="الهاتف"></th>
                                <th class="p-4 data-lang" data-fr="Affecté à" data-ar="المكلف بالملف"></th>
                                <th class="p-4 data-lang" data-fr="Observations" data-ar="ملاحظات / تتبع"></th>
                                <th class="p-4 data-lang" data-fr="Statut & Encaissé" data-ar="الحالة والمبلغ"></th>
                                <th class="p-4 data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                            </tr>
                        </thead>
                        <tbody id="clients-table-body" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-team" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6 border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="text-base font-bold text-gray-800 data-lang" data-fr="Gestion du Personnel (Closers)" data-ar="إدارة الموظفين"></h3>
                            <button onclick="openAddUserModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow transition data-lang" data-fr="+ Nouveau Collaborateur" data-ar="+ إضافة موظف"></button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 uppercase font-bold text-xs tracking-wider">
                                        <th class="p-3 data-lang" data-fr="Collaborateur & Début" data-ar="الموظف وبداية العمل"></th>
                                        <th class="p-3 data-lang" data-fr="Contact & Identifiants" data-ar="الاتصال وبيانات الدخول"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Pièces CIN" data-ar="وثائق الهوية"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Statut" data-ar="الحالة"></th>
                                        <th class="p-3 text-right data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                                    </tr>
                                </thead>
                                <tbody id="team-table-body" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow p-6 border border-gray-100 h-max">
                        <h3 class="text-base font-bold mb-3 text-gray-800 data-lang" data-fr="Envoyer une notification" data-ar="إرسال إشعار موجه"></h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Destinataire" data-ar="المستلم"></label>
                                <select id="msg-destinataire" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-500"></select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Message" data-ar="الرسالة"></label>
                                <textarea id="msg-text" placeholder="Entrez votre consigne ici..." class="w-full h-24 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <button onclick="dispatchMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl text-sm font-bold shadow transition data-lang" data-fr="Diffuser le Message" data-ar="إرسال الرسالة"></button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="user-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
            <h3 id="user-modal-title" class="text-lg font-bold mb-1 text-gray-800"></h3>
            <p class="text-xs text-blue-600 mb-4 font-mono font-bold" id="generated-id-view"></p>
            <input type="hidden" id="u-id-hidden">
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Nom</label>
                        <input id="u-nom" type="text" placeholder="El Alami" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Prénom</label>
                        <input id="u-prenom" type="text" placeholder="Amine" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Date d'arrivée" data-ar="تاريخ الالتحاق"></label>
                    <input id="u-date-arrivee" type="date" class="w-full p-2 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Téléphone</label>
                    <input id="u-tel" type="text" placeholder="0661234567" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Adresse</label>
                    <input id="u-adresse" type="text" placeholder="Casablanca" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Observations / Notes Admin" data-ar="ملاحظات المسؤول"></label>
                    <textarea id="u-observation" placeholder="Ex: Closer Senior..." class="w-full p-2 border rounded-xl text-sm h-16"></textarea>
                </div>
                <div class="border-t border-gray-100 pt-3 mt-3">
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Face (Recto)</label>
                    <input id="u-cin-recto" type="file" accept="image/*" class="w-full text-xs p-1.5 border rounded-xl bg-gray-50">
                </div>
                <div>
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Arrière (Verso)</label>
                    <input id="u-cin-verso" type="file" accept="image/*" class
