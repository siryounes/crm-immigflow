<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration Flow CRM V5 - Cloud Synchronisé</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style> 
        .hidden { display: none; }
        [dir="rtl"] .text-left { text-align: right; }
        [dir="rtl"] .text-right { text-align: left; }
        .sync-loader { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen" id="main-body" dir="ltr">

    <div id="cloud-loading-screen" class="fixed inset-0 bg-slate-900 text-white flex flex-col items-center justify-center z-[100]">
        <div class="text-4xl mb-4 sync-loader">🔄</div>
        <h2 class="text-lg font-bold tracking-wider uppercase mb-1">Immigration Flow Cloud</h2>
        <p class="text-xs text-slate-400 animate-pulse">Connexion à la base de données Google Sheets en cours...</p>
    </div>

    <div id="login-page" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-600 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="text-4xl mb-2">✈️</div>
            <h1 class="text-2xl font-bold text-blue-600 mb-1">IMMIGRATION FLOW</h1>
            <p class="text-gray-400 text-xs mb-6 font-semibold uppercase tracking-wider data-lang" data-fr="Système CRM V5 Évolué" data-ar="نظام إدارة علاقات العملاء المطور V5"></p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Identifiant (Email)" data-ar="البريد الإلكتروني"></label>
                    <input id="username" type="text" placeholder="siryounes66@gmail.com" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Mot de passe" data-ar="كلمة المرور"></label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold mt-6 hover:bg-blue-700 shadow-md hover:shadow-lg transition data-lang" data-fr="Se connecter" data-ar="تسجيل الدخول"></button>
            <p onclick="openForgotPasswordModal()" class="text-xs text-blue-500 font-semibold mt-4 cursor-pointer hover:underline data-lang" data-fr="Mot de passe oublié ?" data-ar="نسيت كلمة المرور؟"></p>
        </div>
    </div>

    <div id="forgot-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm mx-4">
            <h3 class="text-lg font-bold text-gray-800 mb-2 data-lang" data-fr="Récupération de compte" data-ar="استعادة الحساب"></h3>
            <p class="text-xs text-gray-500 mb-4 data-lang" data-fr="Veuillez saisir votre email pour répondre à votre question de sécurité." data-ar="الرجاء إدخال البريد الإلكتروني للإجابة على سؤال الأمان."></p>
            
            <div class="space-y-3">
                <input id="forgot-email" type="text" placeholder="Votre email" class="w-full p-2 border rounded-xl text-sm">
                <button onclick="verifyForgotEmail()" class="w-full bg-gray-800 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Vérifier l'identifiant" data-ar="التحقق من الهوية"></button>
                
                <div id="forgot-question-zone" class="hidden border-t pt-3 mt-3 space-y-2">
                    <p id="forgot-question-text" class="text-xs font-bold text-blue-600 italic"></p>
                    <input id="forgot-answer" type="text" placeholder="Votre réponse" class="w-full p-2 border rounded-xl text-sm">
                    <button onclick="submitSecretAnswer()" class="w-full bg-blue-600 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Valider la réponse" data-ar="تأكيد الإجابة"></button>
                </div>
            </div>
            <button onclick="document.getElementById('forgot-modal').classList.add('hidden')" class="w-full bg-gray-200 text-gray-700 mt-4 p-2 rounded-xl text-xs font-bold data-lang" data-fr="Fermer" data-ar="إغلاق"></button>
        </div>
    </div>

    <div id="app-page" class="hidden">
        <nav class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-1.5 rounded-lg text-lg">✈️</div>
                <div class="flex flex-col">
                    <span class="font-black tracking-wider text-sm md:text-base">IMMIGRATION FLOW</span>
                    <div class="flex items-center space-x-2 mt-0.5">
                        <span id="user-badge" class="text-[10px] bg-blue-900/50 text-blue-200 px-1.5 py-0.5 rounded font-mono font-bold w-max"></span>
                        <span id="sync-indicator" class="text-[9px] bg-green-900 text-green-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest animate-pulse">☁️ Synced</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1 rounded-xl text-xs font-bold transition">🌐 FR / عربي</button>
                <div class="flex bg-blue-800/40 p-1 rounded-xl space-x-1">
                    <button onclick="switchTab('dashboard')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Dashboard" data-ar="لوحة التحكم"></button>
                    <button onclick="switchTab('clients')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Clients" data-ar="الزبناء"></button>
                    <button id="nav-team" onclick="switchTab('team')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition hidden data-lang" data-fr="Équipe & Admin" data-ar="الفريق والتحكم"></button>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition shadow data-lang" data-fr="Déconnexion" data-ar="تسجيل الخروج"></button>
            </div>
        </nav>

        <div id="announcement-bar" class="bg-amber-50 border-l-4 border-amber-500 p-4 m-6 rounded-xl shadow-sm hidden">
            <div class="flex items-center space-x-2">
                <span class="text-base">📢</span>
                <span class="text-amber-800 font-bold text-xs uppercase tracking-wider data-lang" data-fr="Avis important :" data-ar="تنبيه هام :"></span>
                <span id="announcement-text" class="text-sm text-amber-900 font-semibold italic"></span>
            </div>
        </div>

        <div class="p-6 max-w-7xl mx-auto">
            
            <div id="tab-dashboard" class="tab-content">
                <h2 class="text-xl font-bold mb-6 text-gray-800 data-lang" data-fr="Tableau de bord opérationnel" data-ar="لوحة القيادة التشغيلية"></h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Chiffre d'Affaires Encaissé" data-ar="إجمالي الأرباح المحصلة"></p>
                            <p id="stat-ca" class="text-2xl font-black text-gray-800 mt-1">0 DH</p>
                        </div>
                        <div class="text-3xl bg-green-50 p-3 rounded-xl text-green-600">💰</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Acompte (50%)" data-ar="ملفات قيد المعالجة (50%)"></p>
                            <p id="stat-pending" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-amber-50 p-3 rounded-xl text-amber-600">⏳</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Finalisés (100%)" data-ar="الملفات المكتملة (100%)"></p>
                            <p id="stat-closed" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-blue-50 p-3 rounded-xl text-blue-600">✅</div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                    <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center space-x-2">
                        <span>📊</span>
                        <span class="data-lang" data-fr="Statistiques des Transactions et Revenus" data-ar="إحصائيات المعاملات والإيرادات"></span>
                    </h3>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider data-lang" data-fr="Répartition et Estimation Budgétaire" data-ar="توزيع وتقدير الميزانية"></h4>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-green-600 data-lang" data-fr="Revenus Encaissés (Actuels)" data-ar="الإيرادات المحصلة (الحالية)"></span>
                                    <span id="bar-label-encaissed" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-encaissed" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-amber-600 data-lang" data-fr="Reste à Recouvrer (Attente 50%)" data-ar="المتبقي للتحصيل (في الانتظار 50%)"></span>
                                    <span id="bar-label-remaining" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-remaining" class="bg-amber-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-gray-100">
                                <div class="flex justify-between text-xs font-bold mb-1">
                                    <span class="text-blue-700 data-lang" data-fr="Objectif & Volume d'Affaires Total" data-ar="الهدف وإجمالي حجم الأعمال"></span>
                                    <span id="bar-label-total" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-total" class="bg-blue-600 h-full transition-all duration-500" style="width: 100%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Panier Moyen Client" data-ar="متوسط سلة العميل"></p>
                                <p id="stat-avg-basket" class="text-lg font-black text-blue-600 mt-1 font-mono">0 DH</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Transactions Sans Avance" data-ar="معاملات بدون تسبيق"></p>
                                <p id="stat-unpaid-count" class="text-lg font-black text-red-500 mt-1">0</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Taux de Conversion (Soldé)" data-ar="معدل التحويل الكامل"></p>
                                <p id="stat-conversion-rate" class="text-lg font-black text-green-600 mt-1 font-mono">0%</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Volume de Dossiers Total" data-ar="إجمالي حجم الملفات"></p>
                                <p id="stat-total-clients" class="text-lg font-black text-gray-700 mt-1">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-clients" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 data-lang" data-fr="Gestion des Clients" data-ar="إدارة الزبناء"></h2>
                    <button onclick="openClientModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow transition data-lang" data-fr="+ Ajouter un Client" data-ar="+ إضافة زبون"></button>
                </div>
                
                <div class="bg-white rounded-2xl shadow overflow-x-auto border border-gray-100">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                                <th class="p-4 data-lang" data-fr="Date Ajout" data-ar="تاريخ الإضافة"></th>
                                <th class="p-4 data-lang" data-fr="Nom" data-ar="الاسم"></th>
                                <th class="p-4 data-lang" data-fr="Métier & Pays" data-ar="المهنة والبلد"></th>
                                <th class="p-4 data-lang" data-fr="Téléphone" data-ar="الهاتف"></th>
                                <th class="p-4 data-lang" data-fr="Affecté à" data-ar="المكلف بالملف"></th>
                                <th class="p-4 data-lang" data-fr="Observations" data-ar="ملاحظات / تتبع"></th>
                                <th class="p-4 data-lang" data-fr="Statut & Encaissé" data-ar="الحالة والمبلغ"></th>
                                <th class="p-4 data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                            </tr>
                        </thead>
                        <tbody id="clients-table-body" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-team" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6 border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="text-base font-bold text-gray-800 data-lang" data-fr="Gestion du Personnel (Closers)" data-ar="إدارة الموظفين"></h3>
                            <button onclick="openAddUserModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow transition data-lang" data-fr="+ Nouveau Collaborateur" data-ar="+ إضافة موظف"></button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 uppercase font-bold text-xs tracking-wider">
                                        <th class="p-3 data-lang" data-fr="Collaborateur & Début" data-ar="الموظف وبداية العمل"></th>
                                        <th class="p-3 data-lang" data-fr="Contact, Adresse & Note" data-ar="الاتصال، العنوان والملاحظات"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Pièces CIN" data-ar="وثائق الهوية"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Statut" data-ar="الحالة"></th>
                                        <th class="p-3 text-right data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                                    </tr>
                                </thead>
                                <tbody id="team-table-body" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow p-6 border border-gray-100 h-max">
                        <h3 class="text-base font-bold mb-3 text-gray-800 data-lang" data-fr="Envoyer une notification" data-ar="إرسال إشعار موجه"></h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Destinataire" data-ar="المستلم"></label>
                                <select id="msg-destinataire" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-500"></select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Message" data-ar="الرسالة"></label>
                                <textarea id="msg-text" placeholder="Entrez votre consigne ici..." class="w-full h-24 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <button onclick="dispatchMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl text-sm font-bold shadow transition data-lang" data-fr="Diffuser le Message" data-ar="إرسال الرسالة"></button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="user-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
            <h3 id="user-modal-title" class="text-lg font-bold mb-1 text-gray-800"></h3>
            <p class="text-xs text-blue-600 mb-4 font-mono font-bold" id="generated-id-view"></p>
            <input type="hidden" id="u-id-hidden">
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Nom</label>
                        <input id="u-nom" type="text" placeholder="El Alami" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Prénom</label>
                        <input id="u-prenom" type="text" placeholder="Amine" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Date d'arrivée" data-ar="تاريخ الالتحاق"></label>
                    <input id="u-date-arrivee" type="date" class="w-full p-2 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Téléphone</label>
                    <input id="u-tel" type="text" placeholder="0661234567" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Adresse</label>
                    <input id="u-adresse" type="text" placeholder="Casablanca" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Observations / Notes Admin" data-ar="ملاحظات المسؤول"></label>
                    <textarea id="u-observation" placeholder="Ex: Closer Senior..." class="w-full p-2 border rounded-xl text-sm h-16"></textarea>
                </div>
                <div class="border-t border-gray-100 pt-3 mt-3">
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Face (Recto)</label>
                    <input id="u-cin-recto" type="file" accept="image/*" class="w-full text-xs p-1.5 border rounded-xl bg-gray-50">
                </div>
                <div>
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Arrière (Verso)</label>
                    <input id="u-cin-verso" type="file" accept="image/*" class="w-full text-xs p-1.5 border rounded-xl bg-gray-50">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="document.getElementById('user-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs font-bold data-lang" data-fr="Annuler" data-ar="إلغاء"></button>
                <button onclick="saveUser()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 data-lang" data-fr="Sauvegarder" data-ar="حفظ"></button>
            </div>
        </div>
    </div>

    <div id="image-viewer-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50" onclick="this.classList.add('hidden')">
        <div class="bg-white p-4 rounded-2xl max-w-lg w-full mx-4 shadow-2xl" onclick="event.stopPropagation()">
            <h4 id="viewer-title" class="font-bold text-sm mb-2 text-gray-700 text-center"></h4>
            <img id="viewer-img" src="" class="w-full h-auto rounded-xl max-h-[70vh] object-contain">
            <button onclick="document.getElementById('image-viewer-modal').classList.add('hidden')" class="w-full bg-gray-800 text-white mt-4 py-2 rounded-xl text-xs font-bold">Fermer / إغلاق</button>
        </div>
    </div>

    <div id="client-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mx-4">
            <h3 class="text-lg font-bold mb-4 text-gray-800 data-lang" data-fr="Fiche Client" data-ar="بطاقة الزبون"></h3>
            <input type="hidden" id="c-id">
            <input type="hidden" id="c-date-insertion">
            <div class="space-y-3">
                <input id="c-name" type="text" class="w-full p-2.5 border rounded-xl text-sm">
                <input id="c-phone" type="text" class="w-full p-2.5 border rounded-xl text-sm">
                <input id="c-job" type="text" class="w-full p-2.5 border rounded-xl text-sm">
                <select id="c-country" class="w-full p-2.5 border rounded-xl text-sm text-gray-700 bg-white">
                    <option value="Canada 🇨🇦">Canada 🇨🇦</option>
                    <option value="Allemagne 🇩🇪">Allemagne 🇩🇪</option>
                    <option value="Australie 🇦🇺">Australie 🇦🇺</option>
                    <option value="États-Unis 🇺🇸">États-Unis 🇺🇸</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <select id="c-payment-status" class="p-2.5 border rounded-xl text-sm text-gray-700 bg-white">
                        <option value="Non Payé">Non Payé / غير مدفوع</option>
                        <option value="50%">Acompte 50% / تسبيق</option>
                        <option value="100%">Soldé 100% / مدفوع بالكامل</option>
                    </select>
                    <input id="c-payment-amount" type="number" class="p-2.5 border rounded-xl text-sm font-mono">
                </div>
                <div>
                    <textarea id="c-observation" class="w-full p-2.5 border rounded-xl text-sm h-20"></textarea>
                </div>
                <div id="assign-container">
                    <label class="text-[10px] font-bold text-gray-400 block mb-1 uppercase tracking-wider data-lang" data-fr="Assigner à un Closer" data-ar="تعيين للموظف"></label>
                    <select id="c-assign" class="w-full p-2.5 border rounded-xl text-sm bg-white text-gray-700"></select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="closeClientModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs font-bold data-lang" data-fr="Annuler" data-ar="إلغاء"></button>
                <button onclick="saveClient()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 data-lang" data-fr="Sauvegarder" data-ar="حفظ"></button>
            </div>
        </div>
    </div>

    <div id="ia-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-4xl h-[90vh] flex flex-col mx-4">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <h3 id="ia-title" class="text-lg font-bold text-gray-800"></h3>
                <div id="export-actions-zone" class="space-x-1 flex flex-wrap gap-1"></div>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-6 p-4 bg-gray-50 rounded-xl shadow-inner">
                <div id="printable-cv-area" class="bg-white p-6 rounded-xl border border-gray-200 max-w-2xl mx-auto shadow-sm">
                    <div class="border-b-4 border-blue-600 pb-2 mb-4 text-center">
                        <h1 id="pdf-cv-name" class="text-xl font-bold text-blue-600 uppercase tracking-wide"></h1>
                        <p class="text-xs uppercase font-bold text-gray-400 tracking-wider data-lang" data-fr="Curriculum Vitae - Normes Internationales ATS" data-ar="السيرة الذاتية - المعايير الدولية ATS"></p>
                    </div>
                    <div id="pdf-cv-box" class="text-sm font-mono whitespace-pre-line leading-relaxed text-gray-800"></div>
                </div>

                <div id="printable-letter-area" class="bg-white p-6 rounded-xl border border-gray-200 max-w-2xl mx-auto shadow-sm">
                    <div class="border-b-4 border-purple-600 pb-2 mb-4">
                        <h1 id="pdf-letter-name" class="text-xl font-bold text-purple-600 uppercase"></h1>
                        <p class="text-xs uppercase font-bold text-gray-400 tracking-wider data-lang" data-fr="Lettre de Motivation Officielle" data-ar="رسالة تحفيزية رسمية"></p>
                    </div>
                    <div id="pdf-letter-box" class="text-sm font-mono whitespace-pre-line leading-relaxed text-gray-800"></div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-gray-200 max-w-2xl mx-auto shadow-sm">
                    <h3 class="font-bold text-gray-700 mb-2 border-b border-gray-100 pb-2 text-sm data-lang" data-fr="3. Liste des Recruteurs Directs Référencés" data-ar="3. قائمة الموظفين المباشرين المعتمدين"></h3>
                    <table class="w-full text-left border text-xs rounded-xl overflow-hidden">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 font-bold border-b">
                                <th class="p-2 border-r">Organisme</th>
                                <th class="p-2 border-r">Segment Visa</th>
                                <th class="p-2">Contact / URL</th>
                            </tr>
                        </thead>
                        <tbody id="pdf-recrut-table-body" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="document.getElementById('ia-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-600 text-white rounded-xl text-xs font-bold data-lang" data-fr="Fermer" data-ar="إغلاق"></button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION DU LIEN CLOUD GOOGLE SHEETS
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTiZyRoyQmZ3OM0z0G1IsQRu8YupkIaTFrr-jT5c0JAN5WzeUU6LZ9IC89GlANp_zr/exec";

        const placeholders = {
            fr: { name: "Nom complet", phone: "WhatsApp (ex: 2126...)", job: "Métier (ex: Infirmier)", obs: "Observation / Note de suivi", amount: "Chiffre en DH" },
            ar: { name: "الاسم الكامل", phone: "واتساب (مثال: 2126)", job: "المهنة (مثال: ممرض)", obs: "ملاحظة / تتبع الزبون", amount: "المبلغ بالدرهم" }
        };

        let currentLang = "fr";
        let currentUser = null; 
        let clients = [];       
        let users = [];
        let messages = {};
        let collaboratorsList = []; 

        let tempRectoBase64 = "";
        let tempVersoBase64 = "";

        // FONCTION DE SYNCHRONISATION AVEC LE CLOUD GOOGLE SHEETS
        async function cloudSync(actionType) {
            const indicator = document.getElementById('sync-indicator');
            if(indicator) {
                indicator.innerText = "🔄 Sync...";
                indicator.className = "text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest";
            }

            try {
                if (actionType === 'loadAll') {
                    const response = await fetch(GOOGLE_SCRIPT_URL + "?action=loadAll");
                    const result = await response.json();
                    
                    if(result.status === "success") {
                        const parsedData = JSON.parse(result.data || '{"clients":[], "users":[]}');
                        clients = parsedData.clients || [];
                        users = parsedData.users || [];
                        collaboratorsList = result.collaborators || [];
                    }
                } else if (actionType === 'saveAll') {
                    const payload = {
                        clients: clients,
                        users: users
                    };
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "saveAll", data: JSON.stringify(payload) })
                    });
                }
                
                if(indicator) {
                    indicator.innerText = "☁️ Synced";
                    indicator.className = "text-[9px] bg-green-900 text-green-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest animate-pulse";
                }
            } catch (error) {
                console.error("Erreur de synchronisation :", error);
                if(actionType === 'loadAll') {
                    clients = JSON.parse(localStorage.getItem('crm_clients')) || [];
                    users = JSON.parse(localStorage.getItem('crm_users')) || [];
                } else {
                    localStorage.setItem('crm_clients', JSON.stringify(clients));
                    localStorage.setItem('crm_users', JSON.stringify(users));
                }
            }
            
            renderDashboard();
            renderClientsTable();
        }

        // SYSTÈME DE CONNEXION DYNAMIQUE
        function login() {
            const emailInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            if (emailInput === "siryounes66@gmail.com" && passwordInput === "admin123") { 
                currentUser = {
                    email: emailInput,
                    role: "admin",
                    id: "SUPER_ADMIN"
                };
                setupSession();
                return;
            }

            const matchedCollab = collaboratorsList.find(c => c.Email.toLowerCase() === emailInput && String(c["Collaborateur ID"]) === passwordInput);

            if (matchedCollab) {
                currentUser = {
                    email: matchedCollab.Email,
                    role: "collaborateur",
                    id: matchedCollab["Collaborateur ID"],
                    name: matchedCollab.Nom
                };
                setupSession();
            } else {
                alert("Identifiants incorrects. Accès refusé.");
            }
        }

        function setupSession() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('cloud-loading-screen').classList.add('hidden');
            document.getElementById('app-page').classList.remove('hidden');
            
            const badge = document.getElementById('user-badge');
            if(badge) badge.innerText = `${currentUser.id} (${currentUser.role.toUpperCase()})`;

            const navTeam = document.getElementById('nav-team');
            if (currentUser.role !== "admin" && navTeam) {
                navTeam.classList.add('hidden');
            } else if (navTeam) {
                navTeam.classList.remove('hidden');
            }

            renderDashboard();
            renderClientsTable();
        }

        // TABLEAU DE BORD FILTRÉ
        function renderDashboard() {
            const viewableClients = currentUser && currentUser.role === "collaborateur" 
                ? clients.filter(c => c.collaborateurId === currentUser.id)
                : clients;

            let ca = 0;
            let pending = 0;
            let closed = 0;
            let unpaid = 0;

            viewableClients.forEach(c => {
                const amount = parseFloat(c.amount) || 0;
                if (c.status === "100%") {
                    ca += amount;
                    closed++;
                } else if (c.status === "50%") {
                    ca += (amount * 0.5); 
                    pending++;
                } else {
                    unpaid++;
                }
            });

            if(document.getElementById('stat-ca')) document.getElementById('stat-ca').innerText = ca.toLocaleString() + " DH";
            if(document.getElementById('stat-pending')) document.getElementById('stat-pending').innerText = pending;
            if(document.getElementById('stat-closed')) document.getElementById('stat-closed').innerText = closed;
            if(document.getElementById('stat-total-clients')) document.getElementById('stat-total-clients').innerText = viewableClients.length;
            if(document.getElementById('stat-unpaid-count')) document.getElementById('stat-unpaid-count').innerText = unpaid;

            const avg = viewableClients.length ? (ca / viewableClients.length) : 0;
            if(document.getElementById('stat-avg-basket')) document.getElementById('stat-avg-basket').innerText = Math.round(avg).toLocaleString() + " DH";
            
            const rate = viewableClients.length ? ((closed / viewableClients.length) * 100) : 0;
            if(document.getElementById('stat-conversion-rate')) document.getElementById('stat-conversion-rate').innerText = rate.toFixed(1) + "%";
        }

        // TABLE DES CLIENTS FILTRÉE ET SÉCURISÉE
        function renderClientsTable() {
            const tbody = document.getElementById('clients-table-body');
            if (!tbody) return;
            tbody.innerHTML = "";

            const filtered = currentUser && currentUser.role === "collaborateur"
                ? clients.filter(c => c.collaborateurId === currentUser.id)
                : clients;

            filtered.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 transition";
                
                const isLocked = currentUser.role === "collaborateur";
                const actionButtons = isLocked 
                    ? `<span class="text-xs text-gray-400 italic font-medium">Fiche Verrouillée 🔒</span>`
                    : `<button onclick="openClientModal('${c.id}')" class="text-blue-600 hover:underline mr-2 font-bold">Modifier</button>`;

                tr.innerHTML = `
                    <td class="p-4 text-xs font-mono">${c.date || '-'}</td>
                    <td class="p-4 font-bold text-gray-900">${c.name}</td>
                    <td class="p-4 text-xs font-semibold">${c.job || '-'} <br><span class="text-gray-400">${c.country || '-'}</span></td>
                    <td class="p-4 text-xs font-mono">${c.phone}</td>
                    <td class="p-4 text-xs font-bold text-blue-600">${c.collaborateurId || 'Non assigné'}</td>
                    <td class="p-4 text-xs max-w-xs truncate">${c.observation || '-'}</td>
                    <td class="p-4">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${c.status === '100%' ? 'bg-green-100 text-green-700' : c.status === '50%' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${c.status || 'Non Payé'}</span>
                        <div class="text-xs font-mono mt-0.5">${parseFloat(c.amount || 0).toLocaleString()} DH</div>
                    </td>
                    <td class="p-4 text-xs">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ENREGISTREMENT ET MARQUAGE AUTOMATIQUE
        function saveClient() {
            const id = document.getElementById('c-id').value;
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const job = document.getElementById('c-job').value.trim();
            const country = document.getElementById('c-country').value;
            const status = document.getElementById('c-payment-status').value;
            const amount = document.getElementById('c-payment-amount').value;
            const observation = document.getElementById('c-observation').value.trim();

            if (!name || !phone) {
                alert("Le nom et le téléphone sont obligatoires.");
                return;
            }

            if (id) {
                const index = clients.findIndex(c => c.id === id);
                if (index !== -1) {
                    clients[index] = { 
                        ...clients[index], name, phone, job, country, status, amount, observation 
                    };
                }
            } else {
                const newClient = {
                    id: "cl_" + Math.random().toString(36).substr(2, 9),
                    date: new Date().toISOString().split('T')[0],
                    name, phone, job, country, status, amount, observation,
                    collaborateurId: currentUser.id 
                };
                clients.push(newClient);
            }

            closeClientModal();
            cloudSync('saveAll');
        }

        function openClientModal(id = null) {
            document.getElementById('client-modal').classList.remove('hidden');
            if(!id) {
                document.getElementById('c-id').value = "";
                document.getElementById('c-name').value = "";
                document.getElementById('c-phone').value = "";
                document.getElementById('c-job').value = "";
                document.getElementById('c-payment-amount').value = 0;
                document.getElementById('c-observation').value = "";
            } else {
                const c = clients.find(cl => cl.id === id);
                if(c) {
                    document.getElementById('c-id').value = c.id;
                    document.getElementById('c-name').value = c.name;
                    document.getElementById('c-phone').value = c.phone;
                    document.getElementById('c-job').value = c.job || "";
                    document.getElementById('c-country').value = c.country || "Canada 🇨🇦";
                    document.getElementById('c-payment-status').value = c.status || "Non Payé";
                    document.getElementById('c-payment-amount').value = c.amount || 0;
                    document.getElementById('c-observation').value = c.observation || "";
                }
            }
        }

        function closeClientModal() {
            document.getElementById('client-modal').classList.add('hidden');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tabId);
            if(target) target.classList.remove('hidden');
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === "fr" ? "ar" : "fr";
            document.querySelectorAll('.data-lang').forEach(el => {
                const txt = el.getAttribute('data-' + currentLang);
                if(txt) el.innerText = txt;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-page').classList.remove('hidden');
            toggleLanguage(); // Applique la langue par défaut
            cloudSync('loadAll');
        });
    </script>
</body>
