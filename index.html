<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immigration Flow CRM V5 - Cloud Synchronisé</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style> 
        .hidden { display: none; }
        [dir="rtl"] .text-left { text-align: right; }
        [dir="rtl"] .text-right { text-align: left; }
        .sync-loader { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen" id="main-body" dir="ltr">

    <div id="cloud-loading-screen" class="fixed inset-0 bg-slate-900 text-white flex flex-col items-center justify-center z-[100]">
        <div class="text-4xl mb-4 sync-loader">🔄</div>
        <h2 class="text-lg font-bold tracking-wider uppercase mb-1">Immigration Flow Cloud</h2>
        <p class="text-xs text-slate-400 animate-pulse">Connexion à la base de données Google Sheets en cours...</p>
    </div>

    <div id="login-page" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-600 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="text-4xl mb-2">✈️</div>
            <h1 class="text-2xl font-bold text-blue-600 mb-1">IMMIGRATION FLOW</h1>
            <p class="text-gray-400 text-xs mb-6 font-semibold uppercase tracking-wider data-lang" data-fr="Système CRM V5 Évolué" data-ar="نظام إدارة علاقات العملاء المطور V5"></p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Identifiant (Email)" data-ar="البريد الإلكتروني"></label>
                    <input id="username" type="text" placeholder="siryounes66@gmail.com" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase block mb-1 data-lang" data-fr="Mot de passe" data-ar="كلمة المرور"></label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold mt-6 hover:bg-blue-700 shadow-md hover:shadow-lg transition data-lang" data-fr="Se connecter" data-ar="تسجيل الدخول"></button>
            <p onclick="openForgotPasswordModal()" class="text-xs text-blue-500 font-semibold mt-4 cursor-pointer hover:underline data-lang" data-fr="Mot de passe oublié ?" data-ar="نسيت كلمة المرور؟"></p>
        </div>
    </div>

    <div id="forgot-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm mx-4">
            <h3 class="text-lg font-bold text-gray-800 mb-2 data-lang" data-fr="Récupération de compte" data-ar="استعادة الحساب"></h3>
            <p class="text-xs text-gray-500 mb-4 data-lang" data-fr="Veuillez saisir votre email pour répondre à votre question de sécurité." data-ar="الرجاء إدخال البريد الإلكتروني للإجابة على سؤال الأمان."></p>
            
            <div class="space-y-3">
                <input id="forgot-email" type="text" placeholder="Votre email" class="w-full p-2 border rounded-xl text-sm">
                <button onclick="verifyForgotEmail()" class="w-full bg-gray-800 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Vérifier l'identifiant" data-ar="التحقق من الهوية"></button>
                
                <div id="forgot-question-zone" class="hidden border-t pt-3 mt-3 space-y-2">
                    <p id="forgot-question-text" class="text-xs font-bold text-blue-600 italic"></p>
                    <input id="forgot-answer" type="text" placeholder="Votre réponse" class="w-full p-2 border rounded-xl text-sm">
                    <button onclick="submitSecretAnswer()" class="w-full bg-blue-600 text-white p-2 rounded-xl text-xs font-bold data-lang" data-fr="Valider la réponse" data-ar="تأكيد الإجابة"></button>
                </div>
            </div>
            <button onclick="document.getElementById('forgot-modal').classList.add('hidden')" class="w-full bg-gray-200 text-gray-700 mt-4 p-2 rounded-xl text-xs font-bold data-lang" data-fr="Fermer" data-ar="إغلاق"></button>
        </div>
    </div>

    <div id="app-page" class="hidden">
        <nav class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-1.5 rounded-lg text-lg">✈️</div>
                <div class="flex flex-col">
                    <span class="font-black tracking-wider text-sm md:text-base">IMMIGRATION FLOW</span>
                    <div class="flex items-center space-x-2 mt-0.5">
                        <span id="user-badge" class="text-[10px] bg-blue-900/50 text-blue-200 px-1.5 py-0.5 rounded font-mono font-bold w-max"></span>
                        <span id="sync-indicator" class="text-[9px] bg-green-900 text-green-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest animate-pulse">☁️ Synced</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleLanguage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1 rounded-xl text-xs font-bold transition">🌐 FR / عربي</button>
                <div class="flex bg-blue-800/40 p-1 rounded-xl space-x-1">
                    <button onclick="switchTab('dashboard')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Dashboard" data-ar="لوحة التحكم"></button>
                    <button onclick="switchTab('clients')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition data-lang" data-fr="Clients" data-ar="الزبناء"></button>
                    <button id="nav-team" onclick="switchTab('team')" class="px-3 py-1 rounded-lg text-xs md:text-sm font-semibold hover:bg-blue-700 transition hidden data-lang" data-fr="Équipe & Admin" data-ar="الفريق والتحكم"></button>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold transition shadow data-lang" data-fr="Déconnexion" data-ar="تسجيل الخروج"></button>
            </div>
        </nav>

        <div id="announcement-bar" class="bg-amber-50 border-l-4 border-amber-500 p-4 m-6 rounded-xl shadow-sm hidden">
            <div class="flex items-center space-x-2">
                <span class="text-base">📢</span>
                <span class="text-amber-800 font-bold text-xs uppercase tracking-wider data-lang" data-fr="Avis important :" data-ar="تنبيه هام :"></span>
                <span id="announcement-text" class="text-sm text-amber-900 font-semibold italic"></span>
            </div>
        </div>

        <div class="p-6 max-w-7xl mx-auto">
            
            <div id="tab-dashboard" class="tab-content">
                <h2 class="text-xl font-bold mb-6 text-gray-800 data-lang" data-fr="Tableau de bord opérationnel" data-ar="لوحة القيادة التشغيلية"></h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Chiffre d'Affaires Encaissé" data-ar="إجمالي الأرباح المحصلة"></p>
                            <p id="stat-ca" class="text-2xl font-black text-gray-800 mt-1">0 DH</p>
                        </div>
                        <div class="text-3xl bg-green-50 p-3 rounded-xl text-green-600">💰</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Acompte (50%)" data-ar="ملفات قيد المعالجة (50%)"></p>
                            <p id="stat-pending" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-amber-50 p-3 rounded-xl text-amber-600">⏳</div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider data-lang" data-fr="Dossiers Finalisés (100%)" data-ar="الملفات المكتملة (100%)"></p>
                            <p id="stat-closed" class="text-2xl font-black text-gray-800 mt-1">0</p>
                        </div>
                        <div class="text-3xl bg-blue-50 p-3 rounded-xl text-blue-600">✅</div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                    <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center space-x-2">
                        <span>📊</span>
                        <span class="data-lang" data-fr="Statistiques des Transactions et Revenus" data-ar="إحصائيات المعاملات والإيرادات"></span>
                    </h3>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider data-lang" data-fr="Répartition et Estimation Budgétaire" data-ar="توزيع وتقدير الميزانية"></h4>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-green-600 data-lang" data-fr="Revenus Encaissés (Actuels)" data-ar="الإيرادات المحصلة (الحالية)"></span>
                                    <span id="bar-label-encaissed" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-encaissed" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs font-semibold mb-1">
                                    <span class="text-amber-600 data-lang" data-fr="Reste à Recouvrer (Attente 50%)" data-ar="المتبقي للتحصيل (في الانتظار 50%)"></span>
                                    <span id="bar-label-remaining" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-remaining" class="bg-amber-500 h-full transition-all duration-500" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-gray-100">
                                <div class="flex justify-between text-xs font-bold mb-1">
                                    <span class="text-blue-700 data-lang" data-fr="Objectif & Volume d'Affaires Total" data-ar="الهدف وإجمالي حجم الأعمال"></span>
                                    <span id="bar-label-total" class="font-mono">0 DH</span>
                                </div>
                                <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                    <div id="bar-width-total" class="bg-blue-600 h-full transition-all duration-500" style="width: 100%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Panier Moyen Client" data-ar="متوسط سلة العميل"></p>
                                <p id="stat-avg-basket" class="text-lg font-black text-blue-600 mt-1 font-mono">0 DH</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Transactions Sans Avance" data-ar="معاملات بدون تسبيق"></p>
                                <p id="stat-unpaid-count" class="text-lg font-black text-red-500 mt-1">0</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Taux de Conversion (Soldé)" data-ar="معدل التحويل الكامل"></p>
                                <p id="stat-conversion-rate" class="text-lg font-black text-green-600 mt-1 font-mono">0%</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl shadow-xs">
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider data-lang" data-fr="Volume de Dossiers Total" data-ar="إجمالي حجم الملفات"></p>
                                <p id="stat-total-clients" class="text-lg font-black text-gray-700 mt-1">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-clients" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800 data-lang" data-fr="Gestion des Clients" data-ar="إدارة الزبناء"></h2>
                    <button onclick="openClientModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow transition data-lang" data-fr="+ Ajouter un Client" data-ar="+ إضافة زبون"></button>
                </div>
                
                <div class="bg-white rounded-2xl shadow overflow-x-auto border border-gray-100">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                                <th class="p-4 data-lang" data-fr="Date Ajout" data-ar="تاريخ الإضافة"></th>
                                <th class="p-4 data-lang" data-fr="Nom" data-ar="الاسم"></th>
                                <th class="p-4 data-lang" data-fr="Métier & Pays" data-ar="المهنة والبلد"></th>
                                <th class="p-4 data-lang" data-fr="Téléphone" data-ar="الهاتف"></th>
                                <th class="p-4 data-lang" data-fr="Affecté à" data-ar="المكلف بالملف"></th>
                                <th class="p-4 data-lang" data-fr="Observations" data-ar="ملاحظات / تتبع"></th>
                                <th class="p-4 data-lang" data-fr="Statut & Encaissé" data-ar="الحالة والمبلغ"></th>
                                <th class="p-4 data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                            </tr>
                        </thead>
                        <tbody id="clients-table-body" class="text-gray-700 text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-team" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6 border border-gray-100">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="text-base font-bold text-gray-800 data-lang" data-fr="Gestion du Personnel (Closers)" data-ar="إدارة الموظفين"></h3>
                            <button onclick="openAddUserModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow transition data-lang" data-fr="+ Nouveau Collaborateur" data-ar="+ إضافة موظف"></button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 uppercase font-bold text-xs tracking-wider">
                                        <th class="p-3 data-lang" data-fr="Collaborateur & Début" data-ar="الموظف وبداية العمل"></th>
                                        <th class="p-3 data-lang" data-fr="Contact, Adresse & Note" data-ar="الاتصال، العنوان والملاحظات"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Pièces CIN" data-ar="وثائق الهوية"></th>
                                        <th class="p-3 text-center data-lang" data-fr="Statut" data-ar="الحالة"></th>
                                        <th class="p-3 text-right data-lang" data-fr="Actions" data-ar="الإجراءات"></th>
                                    </tr>
                                </thead>
                                <tbody id="team-table-body" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow p-6 border border-gray-100 h-max">
                        <h3 class="text-base font-bold mb-3 text-gray-800 data-lang" data-fr="Envoyer une notification" data-ar="إرسال إشعار موجه"></h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Destinataire" data-ar="المستلم"></label>
                                <select id="msg-destinataire" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-500"></select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 data-lang" data-fr="Message" data-ar="الرسالة"></label>
                                <textarea id="msg-text" placeholder="Entrez votre consigne ici..." class="w-full h-24 p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <button onclick="dispatchMessage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl text-sm font-bold shadow transition data-lang" data-fr="Diffuser le Message" data-ar="إرسال الرسالة"></button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="user-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
            <h3 id="user-modal-title" class="text-lg font-bold mb-1 text-gray-800"></h3>
            <p class="text-xs text-blue-600 mb-4 font-mono font-bold" id="generated-id-view"></p>
            <input type="hidden" id="u-id-hidden">
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Nom</label>
                        <input id="u-nom" type="text" placeholder="El Alami" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Prénom</label>
                        <input id="u-prenom" type="text" placeholder="Amine" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Date d'arrivée" data-ar="تاريخ الالتحاق"></label>
                    <input id="u-date-arrivee" type="date" class="w-full p-2 border rounded-xl text-sm bg-gray-50 font-semibold text-gray-700">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Téléphone</label>
                    <input id="u-tel" type="text" placeholder="0661234567" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider">Adresse</label>
                    <input id="u-adresse" type="text" placeholder="Casablanca" class="w-full p-2 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase tracking-wider data-lang" data-fr="Observations / Notes Admin" data-ar="ملاحظات المسؤول"></label>
                    <textarea id="u-observation" placeholder="Ex: Closer Senior..." class="w-full p-2 border rounded-xl text-sm h-16"></textarea>
                </div>
                <div class="border-t border-gray-100 pt-3 mt-3">
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Face (Recto)</label>
                    <input id="u-cin-recto" type="file" accept="image/*" class="w-full text-xs p-1.5 border rounded-xl bg-gray-50">
                </div>
                <div>
                    <label class="text-xs font-bold text-red-600 block mb-1">Carte d'identité Arrière (Verso)</label>
                    <input id="u-cin-verso" type="file" accept="image/*" class="w-full text-xs p-1.5 border rounded-xl bg-gray-50">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="document.getElementById('user-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs font-bold data-lang" data-fr="Annuler" data-ar="إلغاء"></button>
                <button onclick="saveUser()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 data-lang" data-fr="Sauvegarder" data-ar="حفظ"></button>
            </div>
        </div>
    </div>

    <div id="image-viewer-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50" onclick="this.classList.add('hidden')">
        <div class="bg-white p-4 rounded-2xl max-w-lg w-full mx-4 shadow-2xl" onclick="event.stopPropagation()">
            <h4 id="viewer-title" class="font-bold text-sm mb-2 text-gray-700 text-center"></h4>
            <img id="viewer-img" src="" class="w-full h-auto rounded-xl max-h-[70vh] object-contain">
            <button onclick="document.getElementById('image-viewer-modal').classList.add('hidden')" class="w-full bg-gray-800 text-white mt-4 py-2 rounded-xl text-xs font-bold">Fermer / إغلاق</button>
        </div>
    </div>

    <div id="client-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md mx-4">
            <h3 class="text-lg font-bold mb-4 text-gray-800 data-lang" data-fr="Fiche Client" data-ar="بطاقة الزبون"></h3>
            <input type="hidden" id="c-id">
            <input type="hidden" id="c-date-insertion">
            <div class="space-y-3">
                <input id="c-name" type="text" class="w-full p-2.5 border rounded-xl text-sm">
                <input id="c-phone" type="text" class="w-full p-2.5 border rounded-xl text-sm">
                <input id="c-job" type="text" class="w-full p-2.5 border rounded-xl text-sm">

    <script>
        // CONFIGURATION DU LIEN CLOUD GOOGLE SHEETS
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTiZyRoyQmZ3OM0z0G1IsQRu8YupkIaTFrr-jT5c0JAN5WzeUU6LZ9IC89GlANp_zr/exec";

        const placeholders = {
            fr: { name: "Nom complet", phone: "WhatsApp (ex: 2126...)", job: "Métier (ex: Infirmier)", obs: "Observation / Note de suivi", amount: "Chiffre en DH" },
            ar: { name: "الاسم الكامل", phone: "واتساب (مثال: 2126)", job: "المهنة (مثال: ممرض)", obs: "ملاحظة / تتبع الزبون", amount: "المبلغ بالدرهم" }
        };

        let currentLang = "fr";
        let currentUser = null;
        let clients = [];
        let users = [];
        let messages = {};

        let tempRectoBase64 = "";
        let tempVersoBase64 = "";

        // FONCTION DE SYNCHRONISATION AVEC LE CLOUD GOOGLE SHEETS
        async function cloudSync(actionType) {
            const indicator = document.getElementById('sync-indicator');
            if(indicator) {
                indicator.innerText = "🔄 Sync...";
                indicator.className = "text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest";
            }

            if (GOOGLE_SCRIPT_URL.includes("VOTRE_URL_GOOGLE")) {
                // Secours local si l'URL n'est pas encore configurée
                if(actionType === 'loadAll') {
                    clients = JSON.parse(localStorage.getItem('crm_clients')) || [];
                    users = JSON.parse(localStorage.getItem('crm_users')) || [];
                    messages = JSON.parse(localStorage.getItem('crm_messages')) || { global: "Bienvenue (Mode Démo Local)." };
                    injectDefaultUsersIfEmpty();
                } else {
                    localStorage.setItem('crm_clients', JSON.stringify(clients));
                    localStorage.setItem('crm_users', JSON.stringify(users));
                    localStorage.setItem('crm_messages', JSON.stringify(messages));
                }
                if(indicator) {
                    indicator.innerText = "⚠️ LOCAL DEMO";
                    indicator.className = "text-[9px] bg-red-900 text-red-200 px-1.5 py-0.5 rounded font-bold uppercase";
                }
                return;
            }

            try {
                if (actionType === "saveAll") {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "saveAll", clients, users, messages })
                    });
                } else if (actionType === "loadAll") {
                    const altRes = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ action: "loadAll" })
                    });
                    const cloudData = await altRes.json();
                    clients = cloudData.clients || [];
                    users = cloudData.users || [];
                    messages = cloudData.messages || {};
                    injectDefaultUsersIfEmpty();
                }

                if(indicator) {
                    indicator.innerText = "☁️ Synced";
                    indicator.className = "text-[9px] bg-green-900 text-green-300 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest animate-pulse";
                }
            } catch (err) {
                console.error("Erreur de synchro Cloud: ", err);
                if(indicator) {
                    indicator.innerText = "❌ Connexion Error";
                    indicator.className = "text-[9px] bg-red-900 text-red-200 px-1.5 py-0.5 rounded font-bold uppercase";
                }
            }
        }

        function injectDefaultUsersIfEmpty() {
            if (users.length === 0) {
                users = [
                    { id: 'admin', email: 'siryounes66@gmail.com', name: 'Younes (Admin)', role: 'admin', banned: false, password: 'ImmigFlow2026!', secretQuestion: 'Quel est le nom de votre première école ?', secretAnswer: 'maroc' },
                    { id: 'flow_101', email: 'amine@immigflow.com', name: 'Amine El Alami', dateArrivee: '2026-01-15', tel: '0661998877', adresse: 'Casablanca', observation: 'Closer Étoile - Performance Haute', role: 'closer', banned: false, cinRecto: '', cinVerso: '', password: 'closer101' }
                ];
                cloudSync("saveAll");
            }
        }

        // CHARGEMENT INITIAL AU DÉMARRAGE DE LA PAGE
        window.addEventListener('DOMContentLoaded', async () => {
            await cloudSync("loadAll");
            document.getElementById('cloud-loading-screen').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            updateDOMTexts();
        });

        document.getElementById('u-cin-recto').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() { tempRectoBase64 = reader.result; };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('u-cin-verso').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() { tempVersoBase64 = reader.result; };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        function updateDOMTexts() {
            document.querySelectorAll('.data-lang').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if(text) el.innerText = text;
            });
            document.getElementById('c-name').placeholder = placeholders[currentLang].name;
            document.getElementById('c-phone').placeholder = placeholders[currentLang].phone;
            document.getElementById('c-job').placeholder = placeholders[currentLang].job;
            document.getElementById('c-observation').placeholder = placeholders[currentLang].obs;
            document.getElementById('c-payment-amount').placeholder = placeholders[currentLang].amount;

            const body = document.getElementById('main-body');
            body.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        }

        function toggleLanguage() {
            currentLang = currentLang === "fr" ? "ar" : "fr";
            updateDOMTexts();
            if(currentUser) {
                renderClients();
                renderTeam();
                checkNotifications();
                renderDashboard();
            }
        }

        function openForgotPasswordModal() {
            document.getElementById('forgot-question-zone').classList.add('hidden');
            document.getElementById('forgot-email').value = '';
            document.getElementById('forgot-answer').value = '';
            document.getElementById('forgot-modal').classList.remove('hidden');
        }

        function verifyForgotEmail() {
            const emailIn = document.getElementById('forgot-email').value.trim().toLowerCase();
            const user = users.find(u => u.email === emailIn);
            if (!user) {
                alert(currentLang === 'fr' ? "Email introuvable !" : "البريد الإلكتروني غير موجود !");
                return;
            }
            const zone = document.getElementById('forgot-question-zone');
            const qTxt = document.getElementById('forgot-question-text');
            zone.classList.remove('hidden');
            qTxt.innerText = user.secretQuestion || "Quel est le nom de votre première école ?";
            zone.dataset.userId = user.id;
        }

        function submitSecretAnswer() {
            const userId = document.getElementById('forgot-question-zone').dataset.userId;
            const answerIn = document.getElementById('forgot-answer').value.trim().toLowerCase();
            const user = users.find(u => u.id === userId);

            const expected = user.secretAnswer ? user.secretAnswer.toLowerCase() : "maroc";
            if (user && expected === answerIn) {
                alert((currentLang === 'fr' ? "Validation réussie ! Votre mot de passe est : " : "تم التأكيد بنجاح! كلمة المرور الخاصة بك هي : ") + user.password);
                document.getElementById('forgot-modal').classList.add('hidden');
            } else {
                alert(currentLang === 'fr' ? "Réponse incorrecte !" : "إجابة غير صحيحة !");
            }
        }

        function login() {
            const userIn = document.getElementById('username').value.trim().toLowerCase();
            const passIn = document.getElementById('password').value;
            
            const user = users.find(u => u.id === userIn || u.email === userIn);
            
            if (user && user.password === passIn) {
                if (user.banned) {
                    alert(currentLang === 'fr' ? "Votre compte est banni par l'administrateur !" : "تم حظر حسابك من طرف المسؤول !");
                    return;
                }
                currentUser = user;
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('app-page').classList.remove('hidden');
                document.getElementById('user-badge').innerText = currentUser.name.toUpperCase();
                
                checkNotifications();

                if (currentUser.role === 'admin') {
                    document.getElementById('nav-team').classList.remove('hidden');
                } else {
                    document.getElementById('nav-team').classList.add('hidden');
                }
                switchTab('dashboard');
            } else {
                alert(currentLang === 'fr' ? "Identifiants incorrects !" : "معلومات الدخول غير صحيحة !");
            }
        }

        function checkNotifications() {
            const bar = document.getElementById('announcement-bar');
            const txt = document.getElementById('announcement-text');
            if (messages[currentUser.id]) {
                bar.classList.remove('hidden');
                txt.innerText = messages[currentUser.id] + ` (${currentLang === 'fr' ? 'Message Privé' : 'رسالة خاصة'})`;
            } else if (messages.global) {
                bar.classList.remove('hidden');
                txt.innerText = messages.global;
            } else {
                bar.classList.add('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            updateDOMTexts();
            
            await cloudSync("loadAll");

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'clients') renderClients();
            if (tabId === 'team') { renderTeam(); populateMsgDestinataires(); }
        }

        function populateMsgDestinataires() {
            const select = document.getElementById('msg-destinataire');
            select.innerHTML = `<option value="global">${currentLang === 'fr' ? 'Tout le monde (Global)' : 'الجميع (عام)'}</option>`;
            users.filter(u => u.role === 'closer').forEach(u => {
                select.innerHTML += `<option value="${u.id}">${u.name} (${u.id})</option>`;
            });
        }

        function dispatchMessage() {
            const dest = document.getElementById('msg-destinataire').value;
            const text = document.getElementById('msg-text').value.trim();
            if(!text) return;

            if (dest === 'global') messages.global = text;
            else messages[dest] = text;

            cloudSync("saveAll");
            alert(currentLang === 'fr' ? "Message transmis au Cloud !" : "تم إرسال الرسالة إلى السحابة !");
            document.getElementById('msg-text').value = '';
            checkNotifications();
        }

        function renderDashboard() {
            const viewableClients = currentUser.role === 'admin' ? clients : clients.filter(c => c.assignedTo === currentUser.id);
            
            let totalCAEncaissed = 0;   
            let totalRemaining = 0;     
            let pendingCount = 0;
            let closedCount = 0;
            let unpaidCount = 0;
            
            viewableClients.forEach(c => {
                const amount = parseInt(c.paymentAmount || 0);
                if (c.paymentStatus === "100%") {
                    totalCAEncaissed += amount;
                    closedCount++;
                } else if (c.paymentStatus === "50%") {
                    totalCAEncaissed += amount; 
                    totalRemaining += amount; 
                    pendingCount++;
                } else {
                    unpaidCount++;
                }
            });

            const totalProjectedVolume = totalCAEncaissed + totalRemaining;
            const totalClientsCount = viewableClients.length;
            const averageBasket = totalClientsCount > 0 ? Math.round(totalProjectedVolume / totalClientsCount) : 0;
            const conversionRate = totalClientsCount > 0 ? Math.round((closedCount / totalClientsCount) * 100) : 0;

            document.getElementById('stat-ca').innerText = totalCAEncaissed.toLocaleString() + " DH";
            document.getElementById('stat-pending').innerText = pendingCount;
            document.getElementById('stat-closed').innerText = closedCount;

            document.getElementById('stat-avg-basket').innerText = averageBasket.toLocaleString() + " DH";
            document.getElementById('stat-unpaid-count').innerText = unpaidCount;
            document.getElementById('stat-conversion-rate').innerText = conversionRate + "%";
            document.getElementById('stat-total-clients').innerText = totalClientsCount;

            const maxVolume = totalProjectedVolume > 0 ? totalProjectedVolume : 1;
            const pctEncaissed = Math.round((totalCAEncaissed / maxVolume) * 100);
            const pctRemaining = Math.round((totalRemaining / maxVolume) * 100);

            document.getElementById('bar-label-encaissed').innerText = totalCAEncaissed.toLocaleString() + ` DH (${pctEncaissed}%)`;
            document.getElementById('bar-width-encaissed').style.width = pctEncaissed + "%";

            document.getElementById('bar-label-remaining').innerText = totalRemaining.toLocaleString() + ` DH (${pctRemaining}%)`;
            document.getElementById('bar-width-remaining').style.width = pctRemaining + "%";

            document.getElementById('bar-label-total').innerText = totalProjectedVolume.toLocaleString() + " DH (100%)";
        }

        function renderClients() {
            const tbody = document.getElementById('clients-table-body');
            tbody.innerHTML = '';
            const viewableClients = currentUser.role === 'admin' ? clients : clients.filter(c => c.assignedTo === currentUser.id);

            viewableClients.forEach(client => {
                let actionButtons = `
                    <button onclick="editClient('${client.id}')" class="bg-blue-500 hover:bg-blue-600 text-white px-2.5 py-1 rounded-xl text-xs font-bold shadow-sm transition">${currentLang==='fr'?'Modifier':'تعديل'}</button>
                    <button onclick="triggerIA('${client.name}', 'pack', '${client.job}', '${client.country}', '${client.phone}')" class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded-xl text-xs font-bold shadow-sm transition">🤖 IA Pack</button>
                `;
                if (currentUser.role === 'admin') {
                    actionButtons += `<button onclick="deleteClient('${client.id}')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded-xl text-xs font-bold shadow-sm transition">${currentLang==='fr'?'Supprimer':'حذف'}</button>`;
                }
                const staff = users.find(u => u.id === client.assignedTo);
                const staffName = staff ? staff.name : (currentLang === 'fr' ? 'Non assigné' : 'غير معين');
                const dateDisplay = client.dateInsertion || "-";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition text-xs md:text-sm";
                tr.innerHTML = `
                    <td class="p-4 font-mono font-bold text-gray-400 text-xs">${dateDisplay}</td>
                    <td class="p-4 font-bold text-gray-800">${client.name}</td>
                    <td class="p-4 text-xs">
                        <span class="font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded-lg">${client.job}</span>
                        <div class="text-gray-400 font-semibold mt-1">🌍 ${client.country}</div>
                    </td>
                    <td class="p-4 text-blue-600 font-mono font-bold">${client.phone}</td>
                    <td class="p-4 text-xs font-bold text-gray-600"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded-lg">👤 ${staffName}</span></td>
                    <td class="p-4 text-xs italic text-gray-500 max-w-xs truncate">${client.observation || "-"}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-xl text-xs font-black tracking-wide ${client.paymentStatus==='100%'?'bg-green-100 text-green-800':client.paymentStatus==='50%'?'bg-amber-100 text-amber-800':'bg-red-100 text-red-800'}">${client.paymentStatus}</span>
                        <div class="text-xs font-mono font-black text-gray-700 mt-1">${parseInt(client.paymentAmount || 0).toLocaleString()} DH</div>
                    </td>
                    <td class="p-4 space-x-1 whitespace-nowrap">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openClientModal() {
            document.getElementById('c-id').value = '';
            document.getElementById('c-date-insertion').value = '';
            document.getElementById('c-name').value = '';
            document.getElementById('c-phone').value = '';
            document.getElementById('c-job').value = '';
            document.getElementById('c-observation').value = '';
            document.getElementById('c-payment-amount').value = '';
            
            const selectAssign = document.getElementById('c-assign');
            selectAssign.innerHTML = '';
            if (currentUser.role === 'admin') {
                document.getElementById('assign-container').classList.remove('hidden');
                users.forEach(u => selectAssign.innerHTML += `<option value="${u.id}">${u.name}</option>`);
            } else {
                document.getElementById('assign-container').classList.add('hidden');
                selectAssign.innerHTML = `<option value="${currentUser.id}">${currentUser.name}</option>`;
            }
            document.getElementById('client-modal').classList.remove('hidden');
            updateDOMTexts();
        }

        function editClient(id) {
            const client = clients.find(c => c.id === id);
            openClientModal();
            document.getElementById('c-id').value = client.id;
            document.getElementById('c-date-insertion').value = client.dateInsertion || '';
            document.getElementById('c-name').value = client.name;
            document.getElementById('c-phone').value = client.phone;
            document.getElementById('c-job').value = client.job;
            document.getElementById('c-observation').value = client.observation || '';
            document.getElementById('c-payment-status').value = client.paymentStatus;
            document.getElementById('c-payment-amount').value = client.paymentAmount;
            document.getElementById('c-assign').value = client.assignedTo;
        }

        async function saveClient() {
            const id = document.getElementById('c-id').value;
            const existingDate = document.getElementById('c-date-insertion').value;
            const currentDate = new Date().toISOString().split('T')[0];
            const finalDate = id ? (existingDate || currentDate) : currentDate;

            const clientData = {
                id: id || 'cl_' + Date.now(),
                dateInsertion: finalDate,
                name: document.getElementById('c-name').value.trim(),
                phone: document.getElementById('c-phone').value.trim(),
                job: document.getElementById('c-job').value.trim(),
                country: document.getElementById('c-country').value,
                paymentStatus: document.getElementById('c-payment-status').value,
                paymentAmount: document.getElementById('c-payment-amount').value || 0,
                observation: document.getElementById('c-observation').value,
                assignedTo: document.getElementById('c-assign').value
            };
            if(id) clients = clients.map(c => c.id === id ? clientData : c);
            else clients.push(clientData);
            
            document.getElementById('client-modal').classList.add('hidden');
            await cloudSync("saveAll");
            switchTab('clients');
        }

        async function deleteClient(id) {
            if(confirm(currentLang==='fr'?"Confirmer ?":"هل تريد الحذف؟")) {
                clients = clients.filter(c => c.id !== id);
                await cloudSync("saveAll");
                switchTab('clients');
            }
        }

            document.getElementById('generated-id-view').dataset.id = autoId;
            
            document.getElementById('u-nom').value = '';
            document.getElementById('u-prenom').value = '';
            document.getElementById('u-tel').value = '';
            document.getElementById('u-adresse').value = '';
            document.getElementById('u-observation').value = '';
            
            document.getElementById('u-date-arrivee').value = new Date().toISOString().split('T')[0];
            document.getElementById('u-cin-recto').value = '';
            document.getElementById('u-cin-verso').value = '';
            tempRectoBase64 = "";
            tempVersoBase64 = "";
            
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function editUser(userId) {
            const staff = users.find(u => u.id === userId);
            if (!staff) return;

            document.getElementById('user-modal-title').innerText = currentLang === 'fr' ? "Modifier le Collaborateur" : "تعديل بيانات الموظف";
            document.getElementById('u-id-hidden').value = staff.id;
            document.getElementById('generated-id-view').innerText = `ID DE CONNEXION (NON MODIFIABLE) : ${staff.id}`;
            document.getElementById('generated-id-view').dataset.id = staff.id;

            const nameParts = staff.name.split(' ');
            const prenom = nameParts[0] || '';
            const nom = nameParts.slice(1).join(' ') || '';

            document.getElementById('u-nom').value = nom;
            document.getElementById('u-prenom').value = prenom;
            document.getElementById('u-date-arrivee').value = staff.dateArrivee || '';
            document.getElementById('u-tel').value = staff.tel !== '-' ? staff.tel : '';
            document.getElementById('u-adresse').value = staff.adresse !== '-' ? staff.adresse : '';
            document.getElementById('u-observation').value = staff.observation || '';

            tempRectoBase64 = staff.cinRecto || '';
            tempVersoBase64 = staff.cinVerso || '';
            document.getElementById('u-cin-recto').value = '';
            document.getElementById('u-cin-verso').value = '';

            document.getElementById('user-modal').classList.remove('hidden');
        }

        async function saveUser() {
            const hiddenId = document.getElementById('u-id-hidden').value;
            const autoId = document.getElementById('generated-id-view').dataset.id;
            const nom = document.getElementById('u-nom').value.trim();
            const prenom = document.getElementById('u-prenom').value.trim();
            const dateArrivee = document.getElementById('u-date-arrivee').value;
            const tel = document.getElementById('u-tel').value.trim();
            const adresse = document.getElementById('u-adresse').value.trim();
            const observation = document.getElementById('u-observation').value.trim();

            if(!nom || !prenom) { alert("Nom et prénom obligatoires !"); return; }

            const userData = {
                id: hiddenId || autoId,
                email: hiddenId ? (users.find(u => u.id === hiddenId)?.email || `${prenom.toLowerCase()}@immigflow.com`) : `${prenom.toLowerCase()}@immigflow.com`,
                name: `${prenom} ${nom}`,
                dateArrivee: dateArrivee || "-",
                tel: tel || "-",
                adresse: adresse || "-",
                observation: observation || "",
                role: 'closer',
                banned: hiddenId ? (users.find(u => u.id === hiddenId)?.banned || false) : false,
                cinRecto: tempRectoBase64,
                cinVerso: tempVersoBase64,
                password: hiddenId ? (users.find(u => u.id === hiddenId)?.password || `closer${autoId.split('_')[1]}`) : `closer${autoId.split('_')[1]}`
            };

            if (hiddenId) users = users.map(u => u.id === hiddenId ? userData : u);
            else users.push(userData);

            document.getElementById('user-modal').classList.add('hidden');
            await cloudSync("saveAll");
            renderTeam();
            populateMsgDestinataires();
        }

        function viewCIN(userId, side) {
            const staff = users.find(u => u.id === userId);
            const imgData = side === 'recto' ? staff.cinRecto : staff.cinVerso;
            
            if(!imgData) { alert("Aucune image enregistrée !"); return; }
            document.getElementById('viewer-title').innerText = `${staff.name} - CIN (${side.toUpperCase()})`;
            document.getElementById('viewer-img').src = imgData;
            document.getElementById('image-viewer-modal').classList.remove('hidden');
        }

        function renderTeam() {
            if (currentUser.role !== 'admin') return;
            const tbody = document.getElementById('team-table-body');
            tbody.innerHTML = '';

            users.filter(u => u.role === 'closer').forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "text-xs " + (u.banned ? "bg-red-50/70" : "");
                const arriveeDisplay = u.dateArrivee || "-";

                tr.innerHTML = `
                    <td class="p-3">
                        <span class="font-bold text-gray-800 text-sm">${u.name}</span> <br>
                        <span class="font-mono text-gray-400 font-bold bg-gray-100 px-1 rounded">ID: ${u.id}</span> <br>
                        <span class="text-[10px] text-gray-500 font-semibold">📅 Début : ${arriveeDisplay}</span>
                    </td>
                    <td class="p-3">
                        <span class="font-semibold text-blue-600">${u.tel || '-'}</span> <br>
                        <span class="text-gray-400 font-semibold text-[11px]">✉️ ${u.email || '-'}</span> <br>
                        <span class="text-gray-500 italic text-[11px]">📍 ${u.adresse || '-'}</span>
                        ${u.observation ? `<br><span class="text-purple-600 font-medium block mt-1 bg-purple-50 p-1 rounded-lg border-l-2 border-purple-400 text-[11px]">📝 ${u.observation}</span>` : ''}
                    </td>
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button onclick="viewCIN('${u.id}', 'recto')" class="px-2 py-0.5 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 font-bold text-[10px] shadow-xs">🪪 Recto</button>
                        <button onclick="viewCIN('${u.id}', 'verso')" class="px-2 py-0.5 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 font-bold text-[10px] shadow-xs">🪪 Verso</button>
                    </td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-0.5 rounded-lg font-bold ${u.banned?'bg-red-100 text-red-800':'bg-green-100 text-green-800'}">
                            ${u.banned ? 'Banni' : 'Actif'}
                        </span>
                    </td>
                    <td class="p-3 text-right space-x-1 whitespace-nowrap">
                        <button onclick="editUser('${u.id}')" class="font-bold px-2.5 py-1 rounded-xl bg-blue-500 text-white hover:bg-blue-600 text-xs shadow-xs">Modifier</button>
                        <button onclick="toggleBan('${u.id}')" class="font-bold px-2.5 py-1 rounded-xl ${u.banned?'bg-green-600 hover:bg-green-700':'bg-amber-500 hover:bg-amber-600'} text-white text-xs shadow-xs">
                            ${u.banned ? 'Réactiver' : 'Bannir'}
                        </button>
                        <button onclick="deleteUser('${u.id}')" class="font-bold px-2.5 py-1 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs shadow-xs">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleBan(userId) {
            users = users.map(u => { if (u.id === userId) u.banned = !u.banned; return u; });
            await cloudSync("saveAll");
            renderTeam();
        }

        async function deleteUser(userId) {
            if(confirm("Supprimer ce profil ?")) {
                users = users.filter(u => u.id !== userId);
                await cloudSync("saveAll");
                renderTeam();
                populateMsgDestinataires();
            }
        }

        function triggerIA(clientName, mode, job, country, phone) {
            document.getElementById('ia-modal').classList.remove('hidden');
            document.getElementById('pdf-cv-name').innerText = clientName;
            document.getElementById('pdf-letter-name').innerText = clientName;

            let cvContent = "", letterContent = "", recrutRows = "";

            if (country.includes("Allemagne")) {
                cvContent = `[PROFIL ATS DEUTSCHLAND]\nPOSTE CIBLE : ${job.toUpperCase()}\n- Traitement des dossiers techniques et coordination opérationnelle.\n- Intégration immédiate des standards de sécurité européens.\n- Niveau B1 linguistique en validation active.`;
                letterContent = `Madame, Monsieur,\n\nJe me permets de postuler à votre offre pour le poste de ${job} au sein de votre établissement en Allemagne. Mon parcours au Maroc m'a conféré une solide autonomie...`;
                recrutRows = `<tr><td class="p-2 border font-semibold">ZAV - Bureau Fédéral</td><td class="p-2 border">Carte d'opportunité</td><td class="p-2 border text-blue-600">zav.de</td></tr>`;
            } else {
                cvContent = `[PROFIL ATS CANADA]\nPOSTE CIBLE : ${job.toUpperCase()}\n- Modèle optimisé sans indicateurs personnels conformément aux exigences strictes de sélection canadienne.\n- Gestion fluide des tâches à forte responsabilité technique.`;
                letterContent = `À l'attention des Ressources Humaines,\n\nC'est avec un vif intérêt que je soumets ma candidature pour le poste de ${job} au Canada. Mon expertise technique correspond précisément au profil recherché...`;
                recrutRows = `<tr><td class="p-2 border font-semibold">Guichet Emplois Canada</td><td class="p-2 border">Immigration Économique</td><td class="p-2 border text-blue-600">jobbank.gc.ca</td></tr>`;
            }

            document.getElementById('pdf-cv-box').innerText = cvContent;
            document.getElementById('pdf-letter-box').innerText = letterContent;
            document.getElementById('pdf-recrut-table-body').innerHTML = recrutRows;

            const exportZone = document.getElementById('export-actions-zone');
            const waLink = `https://wa.me/${phone}?text=` + encodeURIComponent(`Salam ${clientName}, voici tes documents PDF (CV ATS et Lettre de Motivation) pour ton dossier ${country}.`);

            exportZone.innerHTML = `
                <button onclick="downloadSinglePDF('printable-cv-area', 'CV_${clientName}')" class="bg-blue-600 text-white px-2.5 py-1 rounded-xl text-xs font-bold hover:bg-blue-700 transition">⬇️ PDF 1 : CV</button>
                <button onclick="downloadSinglePDF('printable-letter-area', 'Lettre_${clientName}')" class="bg-purple-600 text-white px-2.5 py-1 rounded-xl text-xs font-bold hover:bg-purple-700 transition">⬇️ PDF 2 : Lettre</button>
                <button onclick="window.open('${waLink}', '_blank')" class="bg-green-600 text-white px-2.5 py-1 rounded-xl text-xs font-bold hover:bg-green-700 transition">💬 WhatsApp</button>
            `;
            updateDOMTexts();
        }

        function downloadSinglePDF(elementId, fileName) {
            const element = document.getElementById(elementId);
            html2pdf().set({
                margin: 12, filename: `${fileName}.pdf`, image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();
        }
    </script>
</body>
